<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="bg" cx="42%" cy="38%">
      <stop offset="0%" stop-color="#122114"/>
      <stop offset="100%" stop-color="#04070A"/>
    </radialGradient>
    <radialGradient id="sph" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="18%" stop-color="#BBF7D0"/>
      <stop offset="42%" stop-color="#4ADE80"/>
      <stop offset="72%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="50" cy="50" r="32" fill="url(#aura)" filter="url(#halo)"/>

  <!-- Orbital rings -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#4ADE80" stroke-width="0.35" stroke-opacity="0.12"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#4ADE80" stroke-width="0.3" stroke-opacity="0.16"/>

  <!-- Spikes + tip dots -->
  <g transform="translate(50,50)" fill="#4ADE80">
    <!-- Cardinal spikes (longer) -->
    <polygon points="43,0 16,-2.8 16,2.8" fill-opacity="0.9" filter="url(#gl)"/>
    <polygon points="43,0 16,-2.8 16,2.8" transform="rotate(90)" fill-opacity="0.9" filter="url(#gl)"/>
    <polygon points="43,0 16,-2.8 16,2.8" transform="rotate(180)" fill-opacity="0.9" filter="url(#gl)"/>
    <polygon points="43,0 16,-2.8 16,2.8" transform="rotate(270)" fill-opacity="0.9" filter="url(#gl)"/>
    <!-- Diagonal spikes (shorter) -->
    <polygon points="37,0 15,-2.1 15,2.1" transform="rotate(45)" fill-opacity="0.65" filter="url(#gl)"/>
    <polygon points="37,0 15,-2.1 15,2.1" transform="rotate(135)" fill-opacity="0.65" filter="url(#gl)"/>
    <polygon points="37,0 15,-2.1 15,2.1" transform="rotate(225)" fill-opacity="0.65" filter="url(#gl)"/>
    <polygon points="37,0 15,-2.1 15,2.1" transform="rotate(315)" fill-opacity="0.65" filter="url(#gl)"/>
    <!-- Cardinal tip dots -->
    <circle cx="43" cy="0" r="2" filter="url(#gl)"/>
    <circle cx="0" cy="43" r="2" filter="url(#gl)"/>
    <circle cx="-43" cy="0" r="2" filter="url(#gl)"/>
    <circle cx="0" cy="-43" r="2" filter="url(#gl)"/>
    <!-- Diagonal tip dots (r=37, cos/sin 45° = 26.16) -->
    <circle cx="26.16" cy="26.16" r="1.5" fill-opacity="0.8" filter="url(#gl)"/>
    <circle cx="-26.16" cy="26.16" r="1.5" fill-opacity="0.8" filter="url(#gl)"/>
    <circle cx="26.16" cy="-26.16" r="1.5" fill-opacity="0.8" filter="url(#gl)"/>
    <circle cx="-26.16" cy="-26.16" r="1.5" fill-opacity="0.8" filter="url(#gl)"/>
  </g>

  <!-- Sphere halo -->
  <circle cx="50" cy="50" r="20" fill="#4ADE80" fill-opacity="0.18" filter="url(#halo)"/>

  <!-- Main sphere -->
  <circle cx="50" cy="50" r="14.5" fill="url(#sph)"/>

  <!-- Specular highlights -->
  <circle cx="44" cy="42" r="5" fill="white" fill-opacity="0.2"/>
  <circle cx="42.5" cy="40.5" r="2.2" fill="white" fill-opacity="0.48"/>
</svg>
