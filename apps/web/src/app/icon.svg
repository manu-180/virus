<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <g id="spike">
      <line x1="0" y1="-7" x2="0" y2="-11" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="-12.6" r="1.6" fill="#4ade80"/>
    </g>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="16" cy="16" r="7.5" fill="#4ade80" opacity="0.15"/>

  <!-- Body -->
  <circle cx="16" cy="16" r="6.5" fill="#4ade80"/>

  <!-- Inner highlight -->
  <circle cx="13.5" cy="13.5" r="2" fill="white" opacity="0.18"/>

  <!-- 8 spikes -->
  <g transform="translate(16,16)">
    <use href="#spike"/>
    <use href="#spike" transform="rotate(45)"/>
    <use href="#spike" transform="rotate(90)"/>
    <use href="#spike" transform="rotate(135)"/>
    <use href="#spike" transform="rotate(180)"/>
    <use href="#spike" transform="rotate(225)"/>
    <use href="#spike" transform="rotate(270)"/>
    <use href="#spike" transform="rotate(315)"/>
  </g>
</svg>
