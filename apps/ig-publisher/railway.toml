# Railway deployment config for the IG Publisher service.
#
# When linking the service in Railway, set the "Root Directory"
# to `apps/ig-publisher` so this file is detected.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 1
